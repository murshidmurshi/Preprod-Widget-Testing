<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Intentick Preprod Testing Widget</title>
  <meta name="description" content="Intentick Preprod Mobile & Desktop Testing" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Dynamic Script Loader for Preprod Widget -->
  <script>
    (function () {
      const DEFAULT_COLLECT_ID = "Intentick_widget_r7v9swxw";
      const urlParams = new URLSearchParams(window.location.search);
      const activeId = urlParams.get("collect_id") || localStorage.getItem("intentick_collect_id") || DEFAULT_COLLECT_ID;

      window.__ACTIVE_COLLECT_ID__ = activeId;

      function injectWidgetScript() {
        if (document.getElementById("intentick-widget-script")) return;
        const script = document.createElement("script");
        script.id = "intentick-widget-script";
        script.src = "https://preprod.intentick.com/intentick_widget.js";
        script.setAttribute("data-collect-id", activeId);
        script.async = true;
        (document.body || document.head || document.documentElement).appendChild(script);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", injectWidgetScript);
      } else {
        injectWidgetScript();
      }
    })();
  </script>

  <style>
    /* Clean Light & Dark Mode Tokens */
    :root[data-theme="light"] {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --btn-hover: #1e293b;
      --badge-bg: #f8fafc;
      --badge-border: #e2e8f0;
      --badge-text: #334155;
      --accent: #4f46e5;
      --success: #10b981;
    }

    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1f2937;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: #f8fafc;
      --btn-text: #0b0f19;
      --btn-hover: #e2e8f0;
      --badge-bg: #1e293b;
      --badge-border: #334155;
      --badge-text: #cbd5e1;
      --accent: #818cf8;
      --success: #10b981;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top Navigation Header with Change Widget ID on Top-Left */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* Top-Left Action Area */
    .top-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0.45rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      touch-action: manipulation;
      min-height: 36px;
    }

    .btn-action:hover {
      background: var(--btn-hover);
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      touch-action: manipulation;
      min-height: 36px;
    }

    .btn-reset:hover {
      color: var(--text);
      background: var(--badge-bg);
    }

    .id-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 7px;
      padding: 0.4rem 0.65rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 0.78rem;
      color: var(--badge-text);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
      flex-shrink: 0;
    }

    /* Top-Right Theme Toggle */
    .top-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      touch-action: manipulation;
      min-height: 36px;
    }

    .theme-toggle-btn:hover {
      background: var(--badge-bg);
    }

    /* Simple, Light & Minimal Content Area */
    main {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 5rem 1.25rem 6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: calc(100vh - 120px);
    }

    .minimal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .pill-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      background: rgba(79, 70, 229, 0.08);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text);
    }

    p.subtext {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.55;
    }

    /* Minimal Footer with Safe Area */
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 1.25rem 1rem;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 1.25rem);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 640px) {
      header {
        padding: 0.5rem 0.85rem;
        gap: 0.5rem;
      }

      .top-left {
        gap: 0.45rem;
        width: 100%;
        justify-content: space-between;
      }

      .id-badge {
        max-width: 160px;
        font-size: 0.74rem;
        padding: 0.35rem 0.5rem;
      }

      .btn-action {
        font-size: 0.78rem;
        padding: 0.4rem 0.7rem;
      }

      .top-right {
        margin-left: auto;
      }

      main {
        padding: 3rem 1rem 6rem;
      }

      h1 {
        font-size: 1.35rem;
      }

      p.subtext {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header with Change Widget Option on Top-Left -->
  <header>
    <div class="top-left">
      <button class="btn-action" onclick="changeWidgetId()" aria-label="Change Widget ID">
        ✏️ Change Widget ID
      </button>

      <button class="btn-reset" onclick="resetWidgetId()" title="Reset to default ID" aria-label="Reset Collect ID">
        ↺
      </button>

      <span class="id-badge" title="Active Collect ID">
        <span class="dot-live"></span>
        <span id="display-id">Intentick_widget_r7v9swxw</span>
      </span>
    </div>

    <div class="top-right">
      <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle Dark/Light Mode">
        <span id="theme-icon">🌙</span> <span id="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <!-- Clean, Simple & Light Background -->
  <main>
    <div class="minimal-wrap">
      <span class="pill-status">Preprod Environment</span>
      <h1>Intentick Preprod Testing</h1>
      <p class="subtext">
        Lightweight host page for testing the Intentick widget script on mobile and desktop devices.
      </p>
    </div>
  </main>

  <footer>
    <p>Intentick Preprod &bull; <code>https://preprod.intentick.com/intentick_widget.js</code></p>
  </footer>

  <!-- Script Logic for ID Switching and Theme Toggle -->
  <script>
    const DEFAULT_ID = "Intentick_widget_r7v9swxw";

    function getActiveId() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get("collect_id") || localStorage.getItem("intentick_collect_id") || DEFAULT_ID;
    }

    function changeWidgetId() {
      const current = getActiveId();
      const input = window.prompt("Enter Intentick Collect ID:", current);

      if (input === null) return;

      const newId = input.trim();
      if (!newId) {
        window.alert("Collect ID cannot be empty.");
        return;
      }

      localStorage.setItem("intentick_collect_id", newId);
      const url = new URL(window.location.href);
      url.searchParams.set("collect_id", newId);
      window.location.href = url.toString();
    }

    function resetWidgetId() {
      if (confirm("Reset Collect ID back to default (" + DEFAULT_ID + ")?")) {
        localStorage.removeItem("intentick_collect_id");
        const url = new URL(window.location.href);
        url.searchParams.delete("collect_id");
        window.location.href = url.toString();
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute("data-theme") || "light";
      const newTheme = currentTheme === "dark" ? "light" : "dark";

      html.setAttribute("data-theme", newTheme);
      localStorage.setItem("intentick_theme", newTheme);
      updateThemeDisplay(newTheme);
    }

    function updateThemeDisplay(theme) {
      const icon = document.getElementById("theme-icon");
      const label = document.getElementById("theme-label");
      const themeColor = document.getElementById("theme-color-meta");

      if (theme === "dark") {
        if (icon) icon.textContent = "☀️";
        if (label) label.textContent = "Light";
        if (themeColor) themeColor.setAttribute("content", "#0b0f19");
      } else {
        if (icon) icon.textContent = "🌙";
        if (label) label.textContent = "Dark";
        if (themeColor) themeColor.setAttribute("content", "#ffffff");
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const activeId = getActiveId();
      const displayEl = document.getElementById("display-id");
      if (displayEl) displayEl.textContent = activeId;

      const savedTheme = localStorage.getItem("intentick_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      updateThemeDisplay(savedTheme);
    });
  </script>
</body>
</html>
